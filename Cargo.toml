[package]
name = "conduit"
version = "0.6.0"
authors = ["spacedouut", "Tom Wagner <tom.a.wagner@protonmail.com>"]
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-only"
description = "A GTK patchbay for PipeWire"
repository = "https://github.com/spacedouut/conduit"
readme = "README.md"
keywords = ["pipewire", "gtk", "patchbay", "gui", "utility"]
categories = ["gui", "multimedia"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
pipewire = { version = "0.10", features = ["v1_2_0"] }
adw = { version = "0.6", package = "libadwaita", features = ["v1_4"] }
glib = { version = "0.19", features = ["log"] }
async-channel = "2.2"
regex = "1.9"
ksni = { version = "0.3", features = ["blocking"] }

log = "0.4.11"

once_cell = "1.19"

libc = "0.2"
